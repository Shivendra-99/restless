name: Build and release

# Builds Restless for macOS, Windows and Linux, plus the browser extension.
#   - Publish a release on GitHub (Releases → Draft a new release, any tag such as 0.5.0 or v0.5.0)
#     and this builds everything and attaches the files and install notes to it.
#   - Or push a v* tag from a terminal: same result, the release is created for you.
#   - Run it by hand (Actions → Build and release → Run workflow) to only build, or give it the tag
#     of an existing release to add the files to that release.
#
# Signing, all free:
#   - Windows: SignPath Foundation (free for open source). Turned on by setting the repository
#     variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN. Without them the
#     Windows installer is built unsigned. See docs/RELEASING.md.
#   - Microsoft Store: setting MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER and
#     MSSTORE_PUBLISHER_DISPLAY_NAME (from Partner Center) also builds the .appx to upload there.
#     The Store signs it.
#   - macOS: ad-hoc signed (notarizing needs a paid Apple account). scripts/install-mac.sh
#     installs it without the Gatekeeper prompt.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to attach the files to (leave empty to only build)
        required: false
        default: ''

permissions:
  contents: read

# A release made on GitHub with a new v* tag fires both "push" and "release": build once.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false
  # The tag being released, if any, and the code to build.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
  BUILD_REF: ${{ inputs.tag || github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm verify

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Builds Restless-<version>-arm64.dmg and Restless-<version>-x64.dmg, ad-hoc signed.
      - run: pnpm dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restless/desktop dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: apps/desktop/release/*.AppImage
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm build

      # 1. The app folder (release/win-unpacked) without an installer yet, so restless.exe can be
      #    signed before it goes into the installer.
      - run: pnpm exec electron-builder --win dir --x64

      - name: Upload restless.exe for signing
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: apps/desktop/release/win-unpacked/restless.exe
          if-no-files-found: error

      - name: Sign restless.exe (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'restless' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/signed-app

      - name: Put the signed restless.exe back
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed-app/restless.exe release/win-unpacked/restless.exe

      # 2. The installer, made from that folder.
      - run: pnpm exec electron-builder --win nsis --x64 --prepackaged release/win-unpacked

      - name: Upload the installer for signing
        id: unsigned-installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: apps/desktop/release/Restless-Setup-*.exe
          if-no-files-found: error

      - name: Sign the installer (SignPath)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'restless' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/signed-installer

      - name: Collect the Windows files
        run: |
          mkdir -p out
          if [ -d signed-installer ]; then cp signed-installer/*.exe out/; else cp release/Restless-Setup-*.exe out/; fi

      # 3. Microsoft Store package (the Store signs it after review).
      - name: Build the Microsoft Store package
        if: vars.MSSTORE_IDENTITY_NAME != ''
        env:
          IDENTITY: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          pnpm exec electron-builder --win appx --x64 --prepackaged release/win-unpacked \
            -c.appx.identityName="$IDENTITY" -c.appx.publisher="$PUBLISHER" -c.appx.publisherDisplayName="$PUBLISHER_NAME"
          cp release/*.appx out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/desktop/out/*
          if-no-files-found: error

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:extension
      - name: Zip the extension
        run: |
          version=$(node -p "require('./apps/extension/manifest.json').version")
          cd apps/extension/dist && zip -r "../restless-extension-$version.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: apps/extension/restless-extension-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: [mac, linux, windows, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          version="${TAG#v}"
          {
            echo "Restless is a local-first API and MCP client: send HTTP requests, test MCP servers, and record what a website sends in its built-in browser. No login, no account, no cloud."
            echo
            echo "## Install"
            echo
            echo "**macOS** with Homebrew:"
            echo
            echo '```'
            echo "brew install ${OWNER,,}/tap/restless"
            echo '```'
            echo
            echo "Or without Homebrew, run this in Terminal. It downloads the right build for your Mac into Applications:"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/$REPO/main/scripts/install-mac.sh | bash"
            echo '```'
            echo
            echo "Or download \`Restless-$version-arm64.dmg\` (Apple silicon) / \`Restless-$version-x64.dmg\` (Intel). Restless isn't notarized by Apple, so the first time you open a downloaded copy macOS stops it: open System Settings → Privacy & Security and click **Open Anyway**."
            echo
            echo "**Windows**: \`Restless-Setup-$version.exe\`."
            if [ "$SIGNED" != "true" ]; then
              echo "This build is not code-signed yet, so Windows may show \"Windows protected your PC\": click **More info** → **Run anyway**."
            fi
            echo
            echo "**Linux**: the \`.AppImage\` file (make it executable, then run it)."
            echo
            echo "**Browser extension (Chrome / Edge)**: unzip \`restless-extension-$version.zip\`, open chrome://extensions, turn on Developer mode, Load unpacked."
            echo
            echo "Check a download against \`SHA256SUMS.txt\`."
            echo
            echo "---"
            if [ "$SIGNED" = "true" ]; then
              echo "Windows: free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
            fi
            echo "[Code signing policy](https://github.com/$REPO/blob/main/CODE_SIGNING_POLICY.md) · [License: MIT](https://github.com/$REPO/blob/main/LICENSE)"
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Keeps anything you wrote when publishing the release on GitHub; adds the install notes below it.
          body_path: notes.md
          append_body: true
          # GitHub adds its own changelog when the release is made in the UI; only add one for tag pushes.
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: files/*

  # Updates the Homebrew cask in <owner>/homebrew-tap so "brew install <owner>/tap/restless" gets this
  # release. Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read/write on
  # that repository. Skipped when the secret isn't set.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for the tap token
        id: token
        run: if [ -n "$TAP_TOKEN" ]; then echo "present=yes" >> "$GITHUB_OUTPUT"; else echo "No HOMEBREW_TAP_TOKEN secret; skipping."; fi
      - if: steps.token.outputs.present == 'yes'
        uses: actions/checkout@v4
        with: { ref: '${{ env.BUILD_REF }}' }
      - if: steps.token.outputs.present == 'yes'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: steps.token.outputs.present == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: mac
      - name: Write Casks/restless.rb
        if: steps.token.outputs.present == 'yes'
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          arm=$(sha256sum "mac/Restless-$version-arm64.dmg" | cut -d' ' -f1)
          intel=$(sha256sum "mac/Restless-$version-x64.dmg" | cut -d' ' -f1)
          mkdir -p tap/Casks
          node scripts/render-cask.mjs "$TAG" "$version" "$arm" "$intel" "$REPO" > tap/Casks/restless.rb
          cat tap/Casks/restless.rb
      - name: Push to the tap
        if: steps.token.outputs.present == 'yes'
        env:
          TAG: ${{ env.RELEASE_TAG }}
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/restless.rb
          if git diff --cached --quiet; then echo "Cask already up to date"; exit 0; fi
          git commit -m "restless ${TAG#v}"
          git push
